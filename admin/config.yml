backend:
  name: github
  repo: auvrixastore/gleam-beauty
  branch: main

media_folder: "img/productos"
public_folder: "/img/productos"

collections:
  - name: "productos"
    label: "Productos"
    folder: "content/productos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nombre del Producto", name: "title", widget: "string" }
      - { label: "Precio ($)", name: "precio", widget: "number" }
      - { label: "Stock disponible", name: "stock", widget: "number" }
      - { label: "Foto del producto", name: "imagen", widget: "image" }
      - { label: "Descripción", name: "body", widget: "markdown" }
